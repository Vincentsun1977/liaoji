  <!-- Bookmark -->
  <path d="M585 245H669V368C669 381 654 389 644 380L627 365C621 360 613 360 607 365L590 380C580 389 565 381 565 368V265C565 254 574 245 585 245Z" fill="url(#bookmark)"/>

  <!-- Text lines / AI chat summary -->
  <circle cx="324" cy="414" r="18" fill="url(#accent)"/>
  <rect x="375" y="398" width="184" height="35" rx="17.5" fill="url(#accent)"/>
  <rect x="308" y="488" width="302" height="35" rx="17.5" fill="url(#accent)"/>
  <rect x="308" y="578" width="302" height="35" rx="17.5" fill="url(#accent)"/>

  <!-- Notebook binding tabs -->
  <rect x="770" y="395" width="94" height="38" rx="19" fill="#FF7450" opacity="0.96"/>
  <rect x="770" y="486" width="94" height="38" rx="19" fill="#FF6848" opacity="0.96"/>
  <rect x="770" y="577" width="94" height="38" rx="19" fill="#FF5B40" opacity="0.96"/>

