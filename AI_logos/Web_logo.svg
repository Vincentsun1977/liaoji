<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="170" y1="890" x2="850" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3F42"/>
      <stop offset="0.48" stop-color="#FF5A45"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="365" x2="805" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4B3E"/>
      <stop offset="1" stop-color="#FF7C55"/>
    </linearGradient>
    <linearGradient id="bookmark" x1="570" y1="238" x2="660" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF382F"/>
      <stop offset="1" stop-color="#FF7450"/>
    </linearGradient>
    <filter id="softShadow" x="110" y="140" width="804" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#C83A2C" flood-opacity="0.18"/>
    </filter>
    <filter id="bubbleShadow" x="180" y="210" width="650" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#9B2E24" flood-opacity="0.18"/>
    </filter>
  </defs>

